<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>编排控制台 · cc-scheduler</title>
<style>
  :root {
    --bg: #0f1420; --panel: #171e2c; --panel2: #1e2740; --line: #2a3550;
    --text: #e6ebf5; --muted: #8a97b1; --accent: #4f8cff; --green: #2fbf71;
    --red: #f0556b; --amber: #f0a94f; --purple: #9d7bff;
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
    font:14px/1.5 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif; }
  header { display:flex; align-items:center; gap:16px; padding:14px 22px;
    background:var(--panel); border-bottom:1px solid var(--line); position:sticky; top:0; z-index:5; }
  header h1 { font-size:17px; margin:0; }
  header .spacer { flex:1; }
  button { font:inherit; border:1px solid var(--line); background:var(--panel2); color:var(--text);
    padding:6px 12px; border-radius:8px; cursor:pointer; }
  button:hover { border-color:var(--accent); }
  button.go { background:var(--green); border-color:var(--green); color:#06130c; font-weight:600; }
  button.stop { background:var(--red); border-color:var(--red); color:#1a070b; font-weight:600; }
  button:disabled { opacity:.45; cursor:not-allowed; }
  .ghost { background:transparent; }
  .wrap { padding:20px 22px; max-width:1500px; margin:0 auto; }
  .live { font-size:12px; color:var(--muted); display:flex; align-items:center; gap:6px; }
  .dot { width:9px; height:9px; border-radius:50%; background:var(--green); box-shadow:0 0 0 0 rgba(47,191,113,.6);
    animation:pulse 1.6s infinite; }
  @keyframes pulse { 0%{box-shadow:0 0 0 0 rgba(47,191,113,.5);} 70%{box-shadow:0 0 0 8px rgba(47,191,113,0);} 100%{box-shadow:0 0 0 0 rgba(47,191,113,0);} }
  .toast { position:fixed; right:22px; bottom:22px; background:var(--red); color:#fff; padding:10px 14px;
    border-radius:10px; max-width:380px; display:none; z-index:20; box-shadow:0 8px 30px rgba(0,0,0,.4); }
  .toast.show { display:block; }

  /* agent console */
  .console { background:var(--panel); border:1px solid var(--line); border-radius:14px; padding:16px 18px; margin-bottom:22px; }
  .console h2 { margin:0 0 12px; font-size:15px; }
  .console .row { display:flex; flex-wrap:wrap; gap:14px; align-items:center; }
  select { background:var(--panel2); color:var(--text); border:1px solid var(--line); border-radius:8px;
    padding:8px 10px; font:inherit; min-width:220px; }
  .node-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(330px,1fr)); gap:12px; margin-top:14px; }
  .node-card { background:var(--panel2); border:1px solid var(--line); border-radius:12px; padding:14px; }
  .node-card .top { display:flex; align-items:center; justify-content:space-between; margin-bottom:10px; }
  .node-name { font-weight:600; }
  .switch { display:flex; align-items:center; gap:8px; color:var(--muted); font-size:13px; }
  .switch input { width:16px; height:16px; accent-color:var(--green); }
  .switch.locked { color:var(--amber); }
  .node-actions { display:flex; gap:8px; align-items:center; }
  .runstate { font-size:12px; color:var(--muted); margin-top:10px; min-height:32px; }
  .runstate b { color:var(--green); font-weight:600; }
  .runstate .cur { color:var(--accent); }
  .runstate .err { color:var(--red); }

  /* board */
  .board { display:grid; grid-template-columns:repeat(6,minmax(210px,1fr)); gap:12px; align-items:start; }
  .column { background:var(--panel); border:1px solid var(--line); border-radius:12px; padding:10px; min-height:120px; }
  .column h3 { margin:2px 4px 10px; font-size:13px; color:var(--muted); display:flex; justify-content:space-between; }
  .column h3 .count { background:var(--panel2); border-radius:10px; padding:0 8px; color:var(--text); }
  .task { background:var(--panel2); border:1px solid var(--line); border-left-width:3px; border-radius:10px;
    padding:10px; margin-bottom:9px; }
  .task .tid { font-weight:600; font-size:13px; }
  .task .title { color:var(--muted); font-size:12px; margin:3px 0 8px; word-break:break-all; }
  .task .meta { display:flex; flex-wrap:wrap; gap:6px; align-items:center; font-size:11px; }
  .tag { padding:2px 7px; border-radius:20px; background:#26304b; color:var(--muted); }
  .tag.pri-high { background:#3a1d26; color:#ff9aaa; }
  .tag.pri-medium { background:#3a301d; color:#ffce8f; }
  .tag.pri-low { background:#22302a; color:#9fd8b8; }
  .tag.owner { background:#1d2b3a; color:#9cc4ff; }
  .tag.status { background:#2b2340; color:#c9b8ff; }
  .task .lasterr { color:var(--red); font-size:11px; margin-top:7px; word-break:break-all; }
  .task button { margin-top:8px; width:100%; padding:5px; font-size:12px; }
  .empty { color:#56607a; font-size:12px; text-align:center; padding:14px 0; }
  .hint { color:var(--muted); font-size:12px; margin-top:14px; }
  .hint code { background:var(--panel2); padding:1px 6px; border-radius:6px; }
</style>
</head>
<body>
<header>
  <h1>编排控制台 · cc-scheduler</h1>
  <span class="live"><span class="dot"></span><span id="live-text">连接中…</span></span>
  <div class="spacer"></div>
  <button class="ghost" id="btn-reset" title="重置为可复现的演示任务池（会清空当前任务并停止所有 worker）">重置演示池</button>
</header>

<div class="wrap">
  <section class="console">
    <h2>Agent 控制台</h2>
    <div class="row">
      <label>选择 Agent：
        <select id="agent-select"></select>
      </label>
      <span class="hint" id="agent-kind"></span>
    </div>
    <div class="node-grid" id="node-grid"></div>
  </section>

  <section class="board" id="board"></section>

  <p class="hint">
    流程：点亮某 Agent 的节点开关 → 点 <b>GO</b>，它会自动从任务池按优先级/先后顺序领取该节点任务并循环，直到池空或你点 <b>STOP</b>。
    编程节点消费 <code>READY</code>，验收节点消费 <code>REVIEW</code>（且不会验收自己实现的任务）；豆包的验收开关为策略锁定，无法开启。
    ACCEPTED 任务只停在「待集成」，由人工点集成才到 DONE，自动化绝不自动合并。
  </p>
</div>

<div class="toast" id="toast"></div>

<script>
const COLUMNS = [
  { key:"backlog",  label:"待编程",   statuses:["BACKLOG","READY"] },
  { key:"coding",   label:"编程中",   statuses:["CLAIMED","IN_PROGRESS","SUBMITTED"] },
  { key:"review",   label:"待验收",   statuses:["REVIEW"] },
  { key:"accepted", label:"待集成(人工)", statuses:["ACCEPTED","INTEGRATION"] },
  { key:"human",    label:"待人工/异常", statuses:["NEEDS_HUMAN","BLOCKED","FAILED","REWORK"] },
  { key:"done",     label:"完成",     statuses:["DONE"] },
];
const STATUS_LABEL = {
  BACKLOG:"待办", READY:"待编程", CLAIMED:"已认领", IN_PROGRESS:"编程中", SUBMITTED:"已提交",
  REVIEW:"待验收", ACCEPTED:"验收通过", INTEGRATION:"集成中", DONE:"完成",
  NEEDS_HUMAN:"待人工", BLOCKED:"已阻断", FAILED:"失败", REWORK:"返工",
};
const NODE_LABEL = { implement:"编程", acceptance:"验收" };
let state = null, selected = null, toastTimer = null;

function showError(msg){
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove("show"), 5000);
}
async function api(path, body){
  const opt = body ? { method:"POST", headers:{"Content-Type":"application/json"}, body:JSON.stringify(body) } : {};
  const res = await fetch(path, { cache:"no-store", ...opt });
  const data = await res.json().catch(()=>({}));
  if (!res.ok || data.ok === false) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}
function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function ago(iso){ if(!iso) return ""; const ms = Date.now() - Date.parse(iso); if(isNaN(ms)) return "";
  const s = Math.round(ms/1000); if(s<60) return s+" 秒前"; if(s<3600) return Math.round(s/60)+" 分前"; return Math.round(s/3600)+" 时前"; }

function renderAgentSelect(){
  const sel = document.getElementById("agent-select");
  const executors = state.control.executors;
  if (!selected || !executors.some(e=>e.executor_id===selected)) selected = executors[0]?.executor_id || null;
  sel.innerHTML = executors.map(e=>`<option value="${esc(e.executor_id)}" ${e.executor_id===selected?"selected":""}>${esc(e.label)} (${esc(e.executor_id)})</option>`).join("");
  const cur = executors.find(e=>e.executor_id===selected);
  document.getElementById("agent-kind").textContent = cur ? `类型：${esc(cur.kind)} · 状态：${cur.active?"启用":"停用"}` : "";
  renderNodeGrid(cur);
}

function renderNodeGrid(executor){
  const grid = document.getElementById("node-grid");
  if(!executor){ grid.innerHTML=""; return; }
  grid.innerHTML = state.control.nodes.map(node=>{
    const cap = executor.capabilities[node.id] || { enabled:0, locked:0 };
    const sess = executor.sessions[node.id] || {};
    const running = !!sess.running;
    const locked = !!cap.locked;
    const switchCtrl = locked
      ? `<span class="switch locked" title="策略锁定，不可开启">🔒 已锁定（不可开启）</span>`
      : `<label class="switch"><input type="checkbox" data-node="${node.id}" class="cap-switch" ${cap.enabled?"checked":""}/> 能力开关</label>`;
    const runState = running
      ? `<b>● 运行中</b>${sess.current_task_id?` · 当前 <span class="cur">${esc(sess.current_task_id)}</span>`:" · 等待任务"} <br><span>${esc(ago(sess.last_heartbeat))} 心跳</span> ${sess.last_result?`· ${esc(sess.last_result)}`:""}`
      : `○ 空闲 ${sess.last_result?`· <span class="err">${esc(sess.last_result)}</span>`:""}`;
    return `<div class="node-card">
      <div class="top">
        <span class="node-name">${esc(node.label)}节点</span>
        ${switchCtrl}
      </div>
      <div class="node-actions">
        <button class="go" data-go="${node.id}" ${running||!cap.enabled?"disabled":""}>GO</button>
        <button class="stop" data-stop="${node.id}" ${running?"":"disabled"}>STOP</button>
      </div>
      <div class="runstate">${runState}</div>
    </div>`;
  }).join("");

  grid.querySelectorAll(".cap-switch").forEach(input=>{
    input.addEventListener("change", async ()=>{
      try { await api("/api/capability", { executor_id:selected, node:input.dataset.node, enabled:input.checked }); await refresh(); }
      catch(e){ showError(e.message); await refresh(); }
    });
  });
  grid.querySelectorAll("[data-go]").forEach(btn=>btn.addEventListener("click", async ()=>{
    try { await api("/api/go", { executor_id:selected, node:btn.dataset.go }); await refresh(); }
    catch(e){ showError(e.message); }
  }));
  grid.querySelectorAll("[data-stop]").forEach(btn=>btn.addEventListener("click", async ()=>{
    try { await api("/api/stop", { executor_id:selected, node:btn.dataset.stop }); await refresh(); }
    catch(e){ showError(e.message); }
  }));
}

function taskCard(t){
  const owner = t.implementer_executor_id || t.claimed_by || null;
  const canIntegrate = t.status === "ACCEPTED";
  return `<div class="task">
    <div class="tid">${esc(t.task_id)}</div>
    <div class="title">${esc(t.title || "")}</div>
    <div class="meta">
      <span class="tag pri-${esc(t.priority||"medium")}">${esc(t.priority||"medium")}</span>
      <span class="tag status">${esc(STATUS_LABEL[t.status] || t.status)}</span>
      ${owner?`<span class="tag owner">👤 ${esc(owner)}</span>`:""}
    </div>
    ${t.last_error?`<div class="lasterr">⚠ ${esc(t.last_error)}</div>`:""}
    ${canIntegrate?`<button data-integrate="${esc(t.task_id)}">人工集成 → DONE</button>`:""}
  </div>`;
}

function renderBoard(){
  const board = document.getElementById("board");
  const tasks = state.tasks || [];
  board.innerHTML = COLUMNS.map(col=>{
    const items = tasks.filter(t=>col.statuses.includes(t.status));
    return `<div class="column">
      <h3><span>${col.label}</span><span class="count">${items.length}</span></h3>
      ${items.length ? items.map(taskCard).join("") : `<div class="empty">—</div>`}
    </div>`;
  }).join("");
  board.querySelectorAll("[data-integrate]").forEach(btn=>btn.addEventListener("click", async ()=>{
    try { await api("/api/integrate", { task_id:btn.dataset.integrate }); await refresh(); }
    catch(e){ showError(e.message); }
  }));
}

async function refresh(){
  try {
    state = await api("/api/data");
    document.getElementById("live-text").textContent =
      `实时 · ${state.tasks.length} 任务 · 更新于 ${new Date().toLocaleTimeString()}`;
    renderAgentSelect();
    renderBoard();
  } catch(e){
    document.getElementById("live-text").textContent = "无法连接后端：" + e.message;
  }
}

document.getElementById("agent-select").addEventListener("change", e=>{ selected = e.target.value; refresh(); });
document.getElementById("btn-reset").addEventListener("click", async ()=>{
  if(!confirm("重置演示池？将清空当前任务、停止所有 worker，并重建 5 个待编程 + 1 个待验收任务。")) return;
  try { await api("/api/reset-demo", {}); await refresh(); }
  catch(e){ showError(e.message); }
});

refresh();
setInterval(refresh, 1500);
</script>
</body>
</html>
